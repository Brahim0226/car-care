name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # نولّد مجلد android تلقائياً (ما يمسّش lib/main.dart ولا pubspec.yaml)
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.example.carmaintenance --project-name car_maintenance .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="صيانة سيارتي"/' android/app/src/main/AndroidManifest.xml
          cp release.keystore android/app/release.keystore
          python3 tools/patch_android.py .

      - run: flutter pub get

      - name: Build APK (مع إعادة المحاولة عند أخطاء الشبكة)
        run: |
          flutter --version
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "المحاولة $i فشلت، نعيد بعد 40 ثانية..."
            sleep 40
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: car-maintenance-apk
          path: build/app/outputs/flutter-apk/app-release.apk
