name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # نولّد مجلد android تلقائياً (ما يمسّش lib/main.dart ولا pubspec.yaml)
      - name: Generate Android project
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter create --platforms=android --org com.example.carmaintenance --project-name car_maintenance .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="صيانة سيارتي"/' android/app/src/main/AndroidManifest.xml
          test -n "$KEYSTORE_BASE64" || { echo "السر KEYSTORE_BASE64 غير موجود"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          python3 tools/patch_android.py .

      - run: flutter pub get

      - name: Build APK (مع إعادة المحاولة عند أخطاء الشبكة)
        run: |
          flutter --version
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "المحاولة $i فشلت، نعيد بعد 40 ثانية..."
            sleep 40
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: car-maintenance-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # رابط ثابت للتحميل: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release (رابط تحميل للأصدقاء)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk car-care.apk
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          gh release delete latest -y --cleanup-tag || true
          gh release create latest car-care.apk --title "صيانة سيارتي v$VER" --notes "حمّل ملف car-care.apk وثبّته (فعّل التثبيت من مصادر غير معروفة إذا طُلب). التحديث يُثبَّت فوق النسخة القديمة بدون فقدان البيانات." --latest
